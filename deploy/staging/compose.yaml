# Local rehearsal of the staging configuration: the production images, Production settings,
# TLS to PostgreSQL and a certificate-encrypted key ring. Not a deployment.
#   ./deploy/staging/make-certs.sh
#   docker compose -f deploy/staging/compose.yaml up --build
# then open https://localhost:8443 and accept the local certificate warning. The pilot
# invitation code is "rehearsal"; confirmation emails are written inside the web container at
# /tmp/mail (docker compose -f deploy/staging/compose.yaml cp web:/tmp/mail ./mail).
name: bridgetogether-staging

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: couples
      POSTGRES_USER: couples
      POSTGRES_PASSWORD: couples_local_dev_only
    command: >
      postgres -c ssl=on
               -c ssl_cert_file=/certs/postgres.crt
               -c ssl_key_file=/certs/postgres.key
    volumes:
      - ./certs/postgres.crt:/certs/postgres.crt:ro
      - ./certs/postgres.key:/certs/postgres.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couples -d couples"]
      interval: 5s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    image: bridgetogether-web:staging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Production behaviour (HTTPS-only cookies, HSTS, CSP) with one exception: emails go to a
      # folder inside the container because no mail provider has been chosen yet.
      ASPNETCORE_ENVIRONMENT: Rehearsal
      ConnectionStrings__Couples: "Host=db;Database=couples;Username=couples;Password=couples_local_dev_only;SSL Mode=Require"
      Database__MigrateOnStartup: "true"
      DataProtection__CertificatePath: /certs/keyring.pfx
      DataProtection__CertificatePassword: staging-rehearsal-only
      # SHA-256 of "rehearsal"
      Pilot__AccessCodeSha256: 2bcd3e14dca8fdb18ca3d4e958bb1c4df002598ae6e5d80fc9d9824a6b5dc450
      Email__Mode: Pickup
      Email__PickupDirectory: /tmp/mail
      # Caddy terminates TLS, as the Container Apps ingress does in Azure. The web container
      # has no published port, so only the proxy can reach it.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__TrustAllProxies: "true"
    volumes:
      - ./certs/keyring.pfx:/certs/keyring.pfx:ro

  proxy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    image: bridgetogether-worker:staging
    depends_on:
      web:
        condition: service_started
    environment:
      ConnectionStrings__Couples: "Host=db;Database=couples;Username=couples;Password=couples_local_dev_only;SSL Mode=Require"
