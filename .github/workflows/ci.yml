name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Couples.slnx

      - name: Build
        run: dotnet build Couples.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Couples.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Couples.slnx

      - name: Check for vulnerable packages
        run: |
          dotnet list Couples.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -i "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Scan tracked files for secrets
        run: ./eng/scan-secrets.sh

      - name: Validate Docker Compose file
        run: docker compose config --quiet

  deployment:
    name: Images and infrastructure (build and validate only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Built to prove the Dockerfiles work; nothing is pushed or deployed.
      - name: Build web image
        run: docker build --file deploy/docker/web.Dockerfile --tag bridgetogether-web:ci .

      - name: Build worker image
        run: docker build --file deploy/docker/worker.Dockerfile --tag bridgetogether-worker:ci .

      - name: Validate staging rehearsal compose file
        run: docker compose --file deploy/staging/compose.yaml config --quiet

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1

      # No backend and no credentials: this never talks to Azure.
      - name: Validate Azure Terraform
        working-directory: deploy/azure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
