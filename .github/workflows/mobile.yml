name: Phone apps

# Builds the .NET MAUI phone app (src/Couples.Mobile) for the iOS simulator on macOS and for Android
# on Linux: no signing, no store accounts, nothing published. macOS runner minutes cost more than Linux ones, so this runs only
# when the app or the code it shares changes, or by hand.
on:
  pull_request:
    paths:
      - src/Couples.Mobile/**
      - src/Couples.UI/**
      - src/Couples.Client/**
      - src/Couples.Application/**
      - src/Couples.Domain/**
      - .github/workflows/mobile.yml
      - global.json
      - Directory.Build.props
  push:
    branches: [main]
    paths:
      - src/Couples.Mobile/**
      - src/Couples.UI/**
      - src/Couples.Client/**
      - src/Couples.Application/**
      - src/Couples.Domain/**
      - .github/workflows/mobile.yml
      - global.json
      - Directory.Build.props
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-ios:
    name: Build iPhone app (simulator)
    # Needs Xcode 26.x for the pinned iOS 26.0 bindings (see the project file).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode"
          xcodebuild -version

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI iOS workload
        run: dotnet workload install maui-ios

      # TargetFrameworks narrows restore to one platform (--framework still restores both).
      - name: Build
        run: >
          dotnet build src/Couples.Mobile/Couples.Mobile.csproj
          -p:TargetFrameworks=net10.0-ios26.0
          --configuration Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:ValidateXcodeVersion=false

  build-android:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      # The runner image has an Android SDK; this adds the platform version the workload targets.
      - name: Install Android SDK components
        run: >
          dotnet build src/Couples.Mobile/Couples.Mobile.csproj
          -p:TargetFrameworks=net10.0-android
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSdkLicenses=true

      - name: Build
        run: >
          dotnet build src/Couples.Mobile/Couples.Mobile.csproj
          -p:TargetFrameworks=net10.0-android
          --configuration Debug
          -p:AndroidSdkDirectory="$ANDROID_HOME"
