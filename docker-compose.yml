# Local development dependencies only. Not a production deployment.
services:
  postgres:
    image: postgres:17-alpine
    container_name: couples-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-couples}
      POSTGRES_USER: ${POSTGRES_USER:-couples}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couples_local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - couples-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  couples-pgdata:
